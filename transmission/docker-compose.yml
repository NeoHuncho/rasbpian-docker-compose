version: '3.3'
services:
  transmission-openvpn:
    cap_add:
      - NET_ADMIN
    volumes:
      - /mainDrive/torrents:/data
      - /plexDrive:/media
      - /var/lib/docker-volumes/transmission:/config
    environment:
      - OPENVPN_PROVIDER=PIA
      - OPENVPN_CONFIG=france
      - OPENVPN_USERNAME=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - LOCAL_NETWORK=${LOCAL_NETWORK}
      - TRANSMISSION_PEER_LIMIT_GLOBAL=32
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=8
      - PUID=1000
      - PGID=1000
    logging:
      driver: json-file
      options:
        max-size: 10m
    ports:
      - '9092:9091'
    image: haugene/transmission-openvpn:5
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512
    restart: always
