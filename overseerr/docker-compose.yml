---
version: '3'

services:
  overseerr:
    image: sctx/overseerr:1.35.0
    container_name: overseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Tokyo
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /var/lib/docker-volumes/overseerr:/app/config
    restart: always
