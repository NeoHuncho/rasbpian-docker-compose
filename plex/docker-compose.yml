---
version: "2.1"
services:
  plex:
    image: ghcr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    mem_limit: 4g
    memswap_limit: 6g
    cpus: 3.0
    pids_limit: 1024
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - /var/lib/docker-volumes/plex:/config
      - /mainDrive/media:/media
      - /plexDrive:/plexDrive
    restart: always
