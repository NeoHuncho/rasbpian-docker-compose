services:
  backend:
    image: ghcr.io/host-it-labs/pomi-backend:latest
    ports:
      - '3001:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEST_PORT: '3000'
      DATABASE_URL: postgres://user:password@db:5432/pomodoro
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-https://pomi.app}
      GITHUB_FEEDBACK_APP_ID: ${GITHUB_FEEDBACK_APP_ID:-}
      GITHUB_FEEDBACK_APP_INSTALLATION_ID: ${GITHUB_FEEDBACK_APP_INSTALLATION_ID:-}
      GITHUB_FEEDBACK_APP_PRIVATE_KEY: ${GITHUB_FEEDBACK_APP_PRIVATE_KEY:-}
      GITHUB_FEEDBACK_REPOSITORY: ${GITHUB_FEEDBACK_REPOSITORY:-}
      GITHUB_FEEDBACK_LABEL: ${GITHUB_FEEDBACK_LABEL:-feedback}
      NEST_SENTRY_DSN: ${NEST_SENTRY_DSN:?Set NEST_SENTRY_DSN}
      POMI_ADMIN_BOOTSTRAP_TOKEN: ${POMI_ADMIN_BOOTSTRAP_TOKEN:-}
    restart: always

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pomodoro
    volumes:
      - /var/lib/docker-volumes/pomi-db:/var/lib/postgresql/data
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

volumes:
  redisdata:
