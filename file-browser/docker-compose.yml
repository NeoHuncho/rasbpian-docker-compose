services:
  filebrowser:
    image: gtstef/filebrowser:1.5-stable
    container_name: filebrowser
    volumes:
      - /mainDrive:/srv/mainDrive
      - /plexDrive:/srv/plexDrive
      - /var/lib/docker-volumes/file-browser/db:/home/filebrowser/data
    environment:
      FILEBROWSER_ADMIN_PASSWORD: "${FILEBROWSER_ADMIN_PASSWORD:?Set FILEBROWSER_ADMIN_PASSWORD in the deployment environment}"
    ports:
      - "8095:80"
    restart: always
