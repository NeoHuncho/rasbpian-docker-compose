services:
  termix:
    image: ghcr.io/lukegus/termix:2.7.1
    container_name: termix
    restart: always
    network_mode: host
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 512
    volumes:
      - termix-data:/app/data
    environment:
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      PORT: '4567'

volumes:
  termix-data:
    driver: local
