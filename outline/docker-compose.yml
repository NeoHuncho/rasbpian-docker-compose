version: "3.2"
services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline-app
    hostname: outline-app
    ports:
      - 3006:3000
    volumes:
      - /var/lib/docker-volumes/outline/storage:/var/lib/outline/data
    depends_on:
      - postgres
      - redis
    environment:
      PGSSLMODE: disable
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@outline-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://outline-redis:6379
      URL: ${URL}
      PORT: ${PORT}
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: 26214400
      # Authentication is handled by Outline's built-in passkey plugin. No
      # SMTP, OAuth, or OIDC credentials are configured for this service.
      # Enable Passkeys in Settings -> Authentication, then register the
      # first passkey from the authenticated admin account.
    restart: unless-stopped
  redis:
    container_name: outline-redis
    hostname: outline-redis
    image: redis
    volumes:
      - /var/lib/docker-volumes/outline/redis/redis.conf:/redis.conf
    command:
      - redis-server
      - /redis.conf
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 30s
      retries: 3
    restart: unless-stopped
  postgres:
    image: postgres:18
    container_name: outline-postgres
    hostname: outline-postgres
    volumes:
      - /var/lib/docker-volumes/outline/db:/var/lib/postgresql
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - pg_isready
      interval: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
