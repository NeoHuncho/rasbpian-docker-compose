version: '2'

services:
  db:
    image: mariadb:11.8
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 512
    volumes:
      - /var/lib/docker-volumes/nextcloud/db-mariadb118:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud:34
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - /var/lib/docker-volumes/nextcloud/app:/var/www/html
    restart: always
